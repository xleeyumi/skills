# Upstream skill repositories to mirror into vendor/<name>/<skill>/.
# Each source may restrict syncing to selected skill directories with paths.
sources:
  - name: openai-skills
    repository: https://github.com/openai/skills.git
    ref: main
    paths:
      - skills/.system/skill-creator
      - skills/.curated/playwright
  - name: browser-use
    repository: https://github.com/browser-use/browser-use.git
    ref: main
    paths:
      - skills/browser-use
  - name: taste-skill
    repository: https://github.com/Leonxlnx/taste-skill.git
    ref: main
    paths:
      - skills/taste-skill
      - skills/taste-skill-v1
